<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private browser media harness</title>
<body>
<h1>非公開・合成fixture専用の動画処理検証</h1>
<p>Google接続・APIキー・プロンプトは扱いません。test/fixtures の合成動画だけを選択してください。</p>
<p><label>入力fixture <input id="source" type="file" accept="video/mp4,video/quicktime,video/webm"></label></p>
<p><label>続きfixture <input id="ending" type="file" accept="video/mp4,video/quicktime,video/webm"></label></p>
<p><button data-operation="ready">ensureReady</button> <button data-operation="prepare">prepare</button> <button data-operation="trim1">trim1</button> <button data-operation="trim2">trim2</button> <button data-operation="compose">compose</button> <button id="cancel">cancel</button></p>
<p id="phase" role="status">idle</p><pre id="result">{ "status": "idle" }</pre><div id="downloads"></div>
<script type="module" src="/test/browser-harness.js"></script>
</body></html>
